<!DOCTYPE html>
<html lang="en">
    
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Search Page</title>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.0.3/dist/tailwind.min.css" rel="stylesheet"
    crossorigin="anonymous"
    integrity="sha384-j5v8ciPA2RFPNREaQDiOnR6f+uxNsmkf+ubJ3XhcpeGw87qPKwnj6QdA/csqg5H3">
</head>
<body class="bg-gray-100 h-screen flex flex-col items-center justify-center">
    <div class="bg-white p-8 rounded-xl shadow-md w-96">
        <h1 class="text-2xl font-bold mb-4">Search Results</h1>
        <div class="flex space-x-2">
            <label for="search">Search</label>
            <input id="search" type="text" placeholder="Search here" class="border p-2 flex-grow rounded">
            <button onclick="search()" class="bg-blue-500 text-white p-2 rounded hover:bg-blue-700">Search</button>
        </div>
        
        <div id="results" class="text-gray-700 mt-4"></div>
    </div>
    <script>
    // XSS stands for Cross-Site Scripting. 
    // This file shows a basic example of how this exploit might take place.

    // Fixed: only allow http/https URLs, and never build the link through
    // string concatenation + innerHTML (which let user input break out of
    // the href attribute and inject new tags/attributes).
    function isSafeUrl(url) {
        try {
            var parsed = new URL(url, window.location.href);
            return parsed.protocol === 'http:' || parsed.protocol === 'https:';
        } catch (e) {
            return false;
        }
    }

    function search() {
        var query = document.getElementById('search').value;
        var resultsDiv = document.getElementById('results');

        var link = document.createElement('a');
        link.className = 'text-blue-500';
        link.setAttribute('href', isSafeUrl(query) ? query : '#');
        link.textContent = 'Your URL';

        resultsDiv.innerHTML = '';
        resultsDiv.appendChild(link);
    }
      
   
    </script>
</body>
</html>
