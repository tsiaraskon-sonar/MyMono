<!DOCTYPE html>
<html lang="en">
    
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Search Page</title>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.0.3/dist/tailwind.min.css" rel="stylesheet"
    crossorigin="anonymous"
    integrity="sha384-j5v8ciPA2RFPNREaQDiOnR6f+uxNsmkf+ubJ3XhcpeGw87qPKwnj6QdA/csqg5H3">
</head>
<body class="bg-gray-100 h-screen flex flex-col items-center justify-center">
    <div class="bg-white p-8 rounded-xl shadow-md w-96">
        <h1 class="text-2xl font-bold mb-4">Simple Calculator</h1>
        <div class="flex space-x-2">
            <label for="search">Search</label>
            <input id="search" type="text" placeholder="Calculation : 2+3" class="border p-2 flex-grow rounded">
            <button onclick="search()" class="bg-blue-500 text-white p-2 rounded hover:bg-blue-700">Search</button>
        </div>
        
        <div id="results" class="text-gray-700 mt-4"></div>
    </div>
    <script>
    // XSS stands for Cross-Site Scripting. 
    // This file shows a basic example of how this exploit might take place.

    function search() {
        var query = document.getElementById('search').value;
        var resultsDiv = document.getElementById('results');
        var p = document.createElement('p');
        p.textContent = eval(query);

        resultsDiv.innerHTML = '';
        resultsDiv.appendChild(p);
    }
      
   
    </script>
</body>
</html>
